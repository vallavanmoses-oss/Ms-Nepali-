name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Unzip and Build APK
        run: |
          ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
          unzip -o "$ZIP_FILE"
          cd NepaliChristiyaBhajanApp
          gradle assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/NepaliChristiyaBhajan.apk
      - uses: actions/upload-artifact@v4
        with:
          name: NepaliChristiyaBhajan-APK
          path: NepaliChristiyaBhajanApp/app/build/outputs/apk/debug/NepaliChristiyaBhajan.apk
      - name: Create Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0
          name: Nepali Christiya Bhajan v1.0
          files: NepaliChristiyaBhajanApp/app/build/outputs/apk/debug/NepaliChristiyaBhajan.apk
